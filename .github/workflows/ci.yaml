
name: RoadGuard AI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadguard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend
      - name: Validate backend files
        shell: bash
        run: |
          test -f backend/package.json || {
            echo "ERROR: backend/package.json is missing"
            exit 1
          }
          test -f backend/package-lock.json || {
            echo "ERROR: backend/package-lock.json is missing"
            exit 1
          }

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/roadshield-ci
          CI: "true"
        run: npm test

      # Frontend
      - name: Validate frontend files
        shell: bash
        run: |
          test -f frontend/package.json || {
            echo "ERROR: frontend/package.json is missing"
            exit 1
          }
          test -f frontend/package-lock.json || {
            echo "ERROR: frontend/package-lock.json is missing"
            exit 1
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Python AI service
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate AI service
        shell: bash
        run: |
          test -d ai-service || {
            echo "ERROR: ai-service directory is missing"
            exit 1
          }
          python -m compileall -q ai-service

      # Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application Docker image
        run: docker build -f dockerfile -t roadguard-app:ci .

      - name: Build AI service Docker image
        run: docker build -f ai-service/Dockerfile -t roadguard-ai:ci ./ai-service
